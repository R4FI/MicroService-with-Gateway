# Nginx configuration for API Gateway
# This file defines how Nginx will route incoming requests to different microservices

# Events block - handles connection processing configurations
events {
    # Maximum number of simultaneous connections that can be opened by a worker process
    worker_connections 1024;
}

# HTTP block - main configuration for HTTP server
http {
    # Include standard MIME types for proper content type handling
    include /etc/nginx/mime.types;
    
    # Set default content type for responses
    default_type application/json;

    # Define custom log format for better request tracking
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Log all access requests to stdout (Docker best practice)
    access_log /var/log/nginx/access.log main;
    
    # Log all errors to stderr (Docker best practice)
    error_log /var/log/nginx/error.log warn;

    # Upstream block for User Management Service
    # Defines the backend server pool for user-related requests
    upstream user_service {
        # Docker service name and internal port
        # Docker DNS will resolve 'usermanagementservice' to the container IP
        server usermanagementservice:5126;
    }

    # Upstream block for Product Service
    # Defines the backend server pool for product-related requests
    upstream product_service {
        # Docker service name and internal port
        server productservice:5171;
    }

    # Upstream block for Order Service
    # Defines the backend server pool for order-related requests
    upstream order_service {
        # Docker service name and internal port
        server orderservice:5003;
    }

    # Main server block - listens for incoming requests
    server {
        # Listen on port 80 (standard HTTP port)
        # This is the single entry point for all client requests
        listen 80;
        
        # Server name - accepts requests for any hostname
        server_name localhost;

        # Location block for User Management Service
        # Any request starting with /users/ will be routed here
        location /users/ {
            # Route requests to the user_service upstream
            proxy_pass http://user_service/;
            
            # Preserve the original Host header from the client request
            proxy_set_header Host $host;
            
            # Forward the real client IP address (important for logging and security)
            proxy_set_header X-Real-IP $remote_addr;
            
            # Add client IP to X-Forwarded-For header (tracks request through proxies)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Indicate the protocol used by the client (http or https)
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings for backend communication
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Location block for Product Service
        # Any request starting with /products/ will be routed here
        location /products/ {
            # Route requests to the product_service upstream
            proxy_pass http://product_service/;
            
            # Preserve original Host header
            proxy_set_header Host $host;
            
            # Forward real client IP
            proxy_set_header X-Real-IP $remote_addr;
            
            # Track request path through proxies
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Preserve original protocol
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout configurations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Location block for Order Service
        # Any request starting with /orders/ will be routed here
        location /orders/ {
            # Route requests to the order_service upstream
            proxy_pass http://order_service/;
            
            # Preserve original Host header
            proxy_set_header Host $host;
            
            # Forward real client IP
            proxy_set_header X-Real-IP $remote_addr;
            
            # Track request path through proxies
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Preserve original protocol
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout configurations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint for the API Gateway itself
        # Returns 200 OK when the gateway is running
        location /health {
            # Return plain text response
            default_type text/plain;
            
            # Always return 200 OK status
            return 200 "API Gateway is healthy\n";
        }

        # Root endpoint - provides API documentation
        location = / {
            # Return JSON response with available endpoints
            default_type application/json;
            return 200 '{"message":"API Gateway","endpoints":{"/users":"User Management Service","/products":"Product Service","/orders":"Order Service","/health":"Gateway Health Check"}}';
        }
    }
}
